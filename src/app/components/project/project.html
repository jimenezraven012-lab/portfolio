<section
  id="project"
  class="min-h-screen
         bg-white 
         px-6 md:px-16
         py-24
         transition-colors duration-500">

  <!-- TITLE -->
  <div class="text-center">

    <h2
      class="text-5xl font-extrabold
             font-['Lalezar']
             text-black 
             [text-shadow:0_5px_8px_rgba(0,0,0,0.25)]">
      My Project
    </h2>

    <div
      class="w-22 h-1
             bg-indigo-500
             rounded-full
             mx-auto mt-1">
    </div>

  </div>


  <!-- PROJECT CARDS -->
  <div
    class="grid grid-cols-1
           md:grid-cols-2
           lg:grid-cols-3
           gap-8
           max-w-6xl
           mx-auto
           mt-16">

    @for (project of projects; track project.title) {

      <!-- PROJECT CARD -->
      <div
        class="group
               bg-gray-600
               rounded-3xl
               overflow-hidden
               border-2 border-transparent
               hover:border-indigo-700
               shadow-lg
               hover:shadow-[0_15px_35px_rgba(99,102,241,0.35)]
               transition-all duration-300
               hover:-translate-y-2">

        <!-- IMAGE -->
        <div
          class="h-40
                 bg-gray-600
                 flex items-center justify-center
                 overflow-hidden">

          <img
            [src]="project.image"
            [alt]="project.title"
            class="h-full
                   max-w-full
                   object-contain
                   transition-transform duration-300
                   group-hover:scale-105">

        </div>


        <!-- CONTENT -->
        <div class="p-5 text-white">

          <h3 class="text-sm font-bold">
            {{ project.title }}
          </h3>

          <p
            class="text-xs
                   text-gray-200
                   mt-3
                   leading-5
                   min-h-10">
            {{ project.description }}
          </p>


          <!-- VIEW PROJECT -->
          <a
            [href]="project.link"
            target="_blank"
            rel="noopener noreferrer"
            class="inline-block
                   mt-4
                   bg-indigo-500
                   hover:bg-indigo-600
                   text-white
                   text-xs
                   font-semibold
                   px-6 py-2
                   rounded-lg
                   transition-all duration-300
                   hover:scale-105">

            View Project

          </a>

        </div>

      </div>

    }


    <!-- COMING SOON 1 -->
    <div
      class="bg-gray-600
             rounded-3xl
             h-40
             flex items-center justify-center
             border-2 border-transparent
             hover:border-indigo-400
             hover:-translate-y-2
             hover:shadow-[0_15px_35px_rgba(99,102,241,0.35)]
             transition-all duration-300">

      <h3 class="text-white text-xl font-bold">
        COMING SOON!
      </h3>

    </div>


    <!-- COMING SOON 2 -->
    <div
      class="bg-gray-600
             rounded-3xl
             h-40
             flex items-center justify-center
             border-2 border-transparent
             hover:border-indigo-400
             hover:-translate-y-2
             hover:shadow-[0_15px_35px_rgba(99,102,241,0.35)]
             transition-all duration-300">

      <h3 class="text-white text-xl font-bold">
        COMING SOON!
      </h3>

    </div>


    <!-- COMING SOON 3 -->
    <div
      class="bg-gray-600
             rounded-3xl
             h-40
             flex items-center justify-center
             border-2 border-transparent
             hover:border-indigo-400
             hover:-translate-y-2
             hover:shadow-[0_15px_35px_rgba(99,102,241,0.35)]
             transition-all duration-300">

      <h3 class="text-white text-xl font-bold">
        COMING SOON!
      </h3>

    </div>

  </div>

</section>
