<section
  id="home"
  class="min-h-screen flex flex-col md:flex-row items-center justify-between pl-32 pr-16 pt-24 bg-white">

  <!-- LEFT CONTENT -->
   <div
    class="w-full md:flex-1
           flex flex-col
           items-center md:items-start
           text-center md:text-left">

    <!-- GREETING -->
    <p
      class="text-2xl sm:text-3xl
             font-semibold
             mb-3
             text-black">
      Hi,
    </p>


    <!-- NAME -->
    <h1
      class="text-5xl sm:text-6xl
             md:text-6xl
             font-extrabold
             leading-[0.95]
             text-black
             font-['Lalezar']
             [text-shadow:0_3px_0_rgba(0,0,0,0.15),0_8px_8px_rgba(0,0,0,0.30)]
             max-w-full">

      <!-- MOBILE -->
      <span class="block sm:hidden">
        I'M<br>
        MARK<br>
        RAVEN
      </span>

      <!-- TABLET / DESKTOP -->
      <span class="hidden sm:block">
        I'M MARK RAVEN
      </span>

    </h1>


    <!-- ROLE -->
    <h2
      class="text-xl sm:text-2xl md:text-3xl
             mt-5
             text-gray-500 dark:text-gray-400
             typing-text
             max-w-full">
      FRONTEND DEVELOPER
    </h2>


    <!-- DOWNLOAD BUTTON -->
    <a
      href="MarkRavenJimenezWebDev"
      download
      class="inline-block
             mt-7
             bg-indigo-500
             hover:bg-indigo-600
             text-white
             px-7 sm:px-8
             py-3 sm:py-4
             rounded-2xl
             text-lg sm:text-xl
             font-semibold
             shadow-[0_4px_15px_rgba(99,102,241,0.35)]
             hover:shadow-[0_6px_25px_rgba(99,102,241,0.55)]
             transition-all duration-300
             hover:scale-105">
      Download CV
    </a>


    <!-- SOCIAL ICONS -->
    <div
      class="flex
             justify-center md:justify-start
             gap-4 sm:gap-5
             mt-9
             text-4xl sm:text-5xl">

      <a
        href="https://facebook.com"
        target="_blank">
        <i
          class="bx bxl-facebook-square
                 hover:text-blue-600
                 transition-all duration-300
                 hover:scale-110">
        </i>
      </a>

      <a
        href="https://linkedin.com"
        target="_blank">
        <i
          class="bx bxl-linkedin-square
                 hover:text-blue-700
                 transition-all duration-300
                 hover:scale-110">
        </i>
      </a>

      <a
        href="https://instagram.com"
        target="_blank">
        <i
          class="bx bxl-instagram-alt
                 hover:text-pink-500
                 transition-all duration-300
                 hover:scale-110">
        </i>
      </a>

    </div>

  </div>


  <!-- RIGHT IMAGE -->
  <div
    class="w-full md:flex-1
           flex justify-center
           mt-6 md:-mt-20">

    <div class="relative">

      <!-- Violet Glow -->
      <div
        class="absolute inset-0
               bg-indigo-400/20
               blur-3xl
               rounded-full
               scale-90">
      </div>


      <!-- IMAGE -->
      <img
        src="image.png"
        alt="Profile"
        class="relative
               w-72 sm:w-80 md:w-96
               max-w-full
               z-10">


      <!-- Ground Shadow -->
      <div
        class="absolute
               left-1/2
               bottom-0
               -translate-x-1/2
               w-40 sm:w-48
               h-5 sm:h-6
               bg-black/25
               blur-md
               rounded-full">
      </div>

    </div>
